# Daily EURUSD. Use this when you want DECADES of history instead of the two
# years Yahoo serves on H1:
#
#   python -m forexai fetch --symbol EURUSD --timeframe 1d --provider stooq
#   python -m forexai walkforward --config config/eurusd_d1_real.yaml
#
# Daily bars are slower and give far fewer trades, but a strategy that survives
# 20 years of daily data has seen crises an H1 sample of 2023-2025 never will.
# Needs at least ~1 600 daily bars (about 7 years) to build a single fold.
# What changes versus H1: no session filter (a daily bar spans every session),
# a wider volatility band, and a shorter holding horizon counted in days.

instrument:
  symbol: EURUSD
  pip_size: 0.0001
  pip_value_per_lot: 10.0

costs:
  spread_pips: 1.0
  slippage_pips: 0.5          # daily entries fill at the open, often a gap
  commission_per_lot_roundturn: 7.0
  swap_pips_per_night_long: -0.3
  swap_pips_per_night_short: -0.1
  max_tradable_spread_pips: 3.0

labels:
  tp_atr_mult: 3.0
  sl_atr_mult: 1.5
  max_holding_bars: 30        # 6 trading weeks - shorter and most bars time out,
                              # the no-trade class swamps the model (measured)
  atr_period: 14

model:
  ensemble_weights: {gbm: 0.5, forest: 0.3, linear: 0.2}
  calibration_fraction: 0.2
  min_train_samples: 300
  random_state: 7

signal:
  ml_weight: 0.65
  technical_weight: 0.35
  min_score: 0.15
  min_confidence_lift: 1.10   # winning-side probability vs its own base rate
  min_confidence: 0.0         # absolute floor, 0 = off (see README)
  require_agreement: true

risk:
  risk_per_trade: 0.005
  min_reward_risk: 2.0
  min_net_reward_risk: 1.7    # frictions are trivial next to a daily ATR
  sl_atr_mult: 1.5
  tp_atr_mult: 3.0
  max_open_positions: 1
  max_daily_loss: 0.02
  max_total_drawdown: 0.20
  max_consecutive_losses: 4
  cooldown_bars_after_streak: 3
  allowed_sessions: []        # empty = no session filter, correct for daily bars
  min_atr_pips: 25.0
  max_atr_pips: 250.0

data:
  source: csv
  path: data/raw/EURUSD_1D.csv
  timeframe: 1d
  bars: 20000

walk_forward:
  train_bars: 1250            # ~5 years
  test_bars: 250              # ~1 year traded forward
  step_bars: 250
  embargo_bars: 35            # >= labels.max_holding_bars

initial_equity: 10000.0
