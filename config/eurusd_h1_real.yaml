# Template for real EURUSD H1 bars exported from your broker (MT4/MT5) or
# Dukascopy. Copy, edit the path and the cost block to match YOUR account,
# then:  python -m forexai walkforward --config config/eurusd_h1_real.yaml
#
# The cost block is the part people fake. Read your broker's actual typical
# spread and commission and put them here. A strategy that only works at
# 0.2 pips of spread does not work.

instrument:
  symbol: EURUSD
  pip_size: 0.0001
  contract_size: 100000.0
  min_lot: 0.01
  lot_step: 0.01
  max_lot: 50.0
  pip_value_per_lot: 10.0     # valid when the account currency is the quote currency

costs:
  spread_pips: 1.0
  slippage_pips: 0.2
  commission_per_lot_roundturn: 7.0
  swap_pips_per_night_long: -0.3
  swap_pips_per_night_short: -0.1
  max_tradable_spread_pips: 2.5

labels:
  tp_atr_mult: 3.0            # keep in sync with risk.tp_atr_mult
  sl_atr_mult: 1.5            # keep in sync with risk.sl_atr_mult
  max_holding_bars: 48
  atr_period: 14

model:
  ensemble_weights: {gbm: 0.5, forest: 0.3, linear: 0.2}
  calibration_fraction: 0.2
  min_train_samples: 400
  random_state: 7

signal:
  ml_weight: 0.65
  technical_weight: 0.35
  min_score: 0.15
  min_confidence_lift: 1.10   # winning-side probability vs its own base rate
  min_confidence: 0.0         # absolute floor, 0 = off (see README)
  require_agreement: true

risk:
  risk_per_trade: 0.005       # 0.5% - do not raise this to make a bad system look good
  min_reward_risk: 2.0
  min_net_reward_risk: 1.5
  sl_atr_mult: 1.5
  tp_atr_mult: 3.0
  max_open_positions: 1
  max_daily_loss: 0.02
  max_total_drawdown: 0.20
  max_consecutive_losses: 4
  cooldown_bars_after_streak: 12
  allowed_sessions: [london, overlap, newyork]
  min_atr_pips: 5.0
  max_atr_pips: 60.0

data:
  source: csv
  path: data/raw/EURUSD_H1.csv
  timeframe: 1h
  bars: 60000

walk_forward:
  train_bars: 6000            # ~1 year of H1 bars
  test_bars: 1500             # ~3 months traded forward
  step_bars: 1500
  embargo_bars: 96            # >= labels.max_holding_bars

initial_equity: 10000.0
