# The test suite is the only thing standing between a research stack and a
# machine that lies convincingly. It runs on every push.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet -r requirements-dev.txt
      - run: python -m pytest tests/ -q
